{% extends 'someapp/base.html' %}

{% block title %}Регистрация - PC Configurator{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="custom-card p-4 shadow-sm">
            <h3 class="text-center mb-4">Создать аккаунт</h3>
            
            <div id="error-msg" class="alert alert-danger" style="display: none;"></div>

            <form id="register-form">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Имя пользователя (Username)</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Имя (необязательно)</label>
                    <input type="text" id="first_name" class="form-control">
                </div>
                <div class="mb-4">
                    <label class="form-label">Пароль</label>
                    <input type="password" id="password" class="form-control" required minlength="6">
                </div>
                <button type="submit" class="btn btn-brand w-100 py-2">Зарегистрироваться</button>
            </form>
            
            <div class="text-center mt-3 text-muted">
                Уже есть аккаунт? <a href="/login/">Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        const email = document.getElementById('email').value;
        const username = document.getElementById('username').value;
        const first_name = document.getElementById('first_name').value;
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('error-msg');
        
        try {
          const response = await fetch('/api/auth/register/', {
    method: 'POST',
    headers: { 
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfToken  
    },
    body: JSON.stringify({ email, username, first_name, password })
});

            if (response.ok) {
           
              
                window.location.href = '/login/';
            } else {
                const data = await response.json();
                errorBox.style.display = 'block';
                errorBox.textContent = JSON.stringify(data); 
            }
        } catch (error) {
            errorBox.style.display = 'block';
            errorBox.textContent = 'Ошибка сервера. Попробуйте позже.';
        }
    });
</script>
{% endblock %}
