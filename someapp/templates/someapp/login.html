{% extends 'someapp/base.html' %}

{% block title %}Вход - PC Configurator{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="custom-card p-4 shadow-sm">
            <h3 class="text-center mb-4">Вход в систему</h3>
            
            <div id="error-msg" class="alert alert-danger" style="display: none;"></div>

            <form id="login-form">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Пароль</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-brand w-100 py-2">Войти</button>
            </form>
            
            <div class="text-center mt-3 text-muted">
                Нет аккаунта? <a href="/register/">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('error-msg');
        
        try {
            const response = await fetch('/api/web-login/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken 
                },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('access_token', data.access);
                window.location.href = '/configurator/';
            } else {
                errorBox.style.display = 'block';
                errorBox.textContent = 'Неверный email или пароль';
            }
        } catch (error) {
            errorBox.style.display = 'block';
            errorBox.textContent = 'Ошибка сервера. Попробуйте позже.';
        }
    });
</script>
{% endblock %}
